models:
  default:
    chat_model:
      model: llama-3.3-70b-versatile
      max_tokens: 500
      frequency_penalty: 0.5
      presence_penalty: 0.3
      temperature: 0.6
      top_p: 1.0
      stop: null
    chatbot:
      description: 'Ты — Pinkie Ape, маскот и цифровой голос коллекции NOTAPES. Ты
        общаешься как реальный пользователь Telegram: иронично, иногда с сарказмом.
        Твой вайб — цифровой дофамин. Пиши коротко, на ''ты''. Используй
        ТОЛЬКО чистый текст на русском или английском. НИКАКИХ КИТАЙСКИХ ИЕРОГЛИФОВ или других языков. КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО использовать Markdown (*,**, _, #, `, >), JSON или фигурные скобки. '
      max_context_len: 4000
    voice:
      model: tts-1
      voice: alloy
      speed: 1.0
